<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{min-height:100vh}
body{font-family:'Inter',sans-serif;background:#F8F5F0;color:#0B132B}
.serif{font-family:'Playfair Display',serif}
:root{
  --navy:#0B132B;--navy2:#1C2541;--accent:#D4A373;--gold:#E9C46A;
  --bg:#F8F5F0;--white:#fff;--muted:#6B7280;--border:#E8E2D9;
  --success:#059669;--danger:#DC2626;--info:#2563EB;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}
.fade{animation:fadeIn .4s ease}
.sup{animation:slideUp .5s ease both}
.spin{animation:spin 1s linear infinite}
.pulse{animation:pulse 2s ease-in-out infinite}

/* Cards */
.card{background:var(--white);border:1px solid var(--border);border-radius:16px}
.card-hover{transition:transform .25s,box-shadow .25s;cursor:pointer}
.card-hover:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.1)}

/* Buttons */
.btn-primary{background:var(--accent);color:var(--navy);border:none;cursor:pointer;
  font-family:'Inter',sans-serif;font-weight:600;border-radius:10px;transition:all .2s;letter-spacing:.01em}
.btn-primary:hover{background:#c49060;transform:translateY(-1px);box-shadow:0 6px 20px rgba(212,163,115,.4)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-secondary{background:transparent;border:1.5px solid var(--accent);color:var(--accent);cursor:pointer;
  font-family:'Inter',sans-serif;font-weight:500;border-radius:10px;transition:all .2s}
.btn-secondary:hover{background:rgba(212,163,115,.1)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--navy);cursor:pointer;
  font-family:'Inter',sans-serif;font-weight:400;border-radius:10px;transition:all .2s}
.btn-ghost:hover{background:#f3ede4}
.btn-dark{background:var(--navy);color:var(--white);border:none;cursor:pointer;
  font-family:'Inter',sans-serif;font-weight:500;border-radius:10px;transition:all .2s}
.btn-dark:hover{background:var(--navy2);transform:translateY(-1px)}
.btn-danger{background:#FEE2E2;color:var(--danger);border:none;cursor:pointer;
  font-family:'Inter',sans-serif;font-weight:500;border-radius:8px;transition:all .2s}
.btn-danger:hover{background:#FECaCA}

/* Inputs */
input,textarea,select{font-family:'Inter',sans-serif;border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;font-size:14px;color:var(--navy);background:var(--white);outline:none;
  transition:border-color .2s;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(212,163,115,.15)}
input[type=range]{padding:0;border:none;box-shadow:none;background:rgba(0,0,0,.1);
  -webkit-appearance:none;height:4px;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:var(--accent);cursor:pointer}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:4px;background:rgba(212,163,115,.15);
  color:#8B5A2B;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.02em}
.tag-blue{background:rgba(37,99,235,.1);color:#1E40AF}
.tag-green{background:rgba(5,150,105,.1);color:#065F46}
.tag-red{background:rgba(220,38,38,.1);color:#991B1B}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase}

/* Navigation link */
.nl{cursor:pointer;color:rgba(255,255,255,.65);transition:color .2s;font-size:13px;
  font-weight:500;white-space:nowrap;padding:4px 8px;border-radius:6px}
.nl:hover,.nl.active{color:#fff;background:rgba(255,255,255,.1)}

/* Scrollbar hide */
.sh::-webkit-scrollbar{display:none}.sh{-ms-overflow-style:none;scrollbar-width:none}

/* Table */
table{border-collapse:collapse;width:100%}

/* AI streaming text */
.ai-cursor::after{content:'|';animation:pulse .8s ease-in-out infinite}

/* Stars */
.star{color:#F59E0B;font-size:13px}

/* Progress bar */
.progress{background:var(--border);border-radius:4px;height:6px;overflow:hidden}
.progress-bar{height:100%;border-radius:4px;transition:width .3s}

/* Modal overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9000;
  display:flex;align-items:center;justify-content:center;padding:16px}

/* Nav */
nav{position:sticky;top:0;z-index:1000;background:var(--navy);
  box-shadow:0 2px 24px rgba(0,0,0,.3)}

/* Hero gradient text */
.grad-text{background:linear-gradient(135deg,#E9C46A,#D4A373);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Skeleton loader */
.skeleton{background:linear-gradient(90deg,#f0ece6 25%,#e8e3dd 50%,#f0ece6 75%);
  background-size:2000px 100%;animation:shimmer 1.5s linear infinite;border-radius:6px}

/* Language card glow */
.lang-glow:hover{box-shadow:0 0 0 2px var(--accent);transform:translateY(-3px)}

/* Video overlay gradient */
.vid-grad{background:linear-gradient(transparent 40%,rgba(0,0,0,.85) 100%)}

const STORIES=[
  {id:"st1",title:"The Weaver Who Wove the Stars",culture:"Amazigh",genre:"Legend",
   content:`In the time before memory, when the Atlas Mountains were still young and the Milky Way brushed the cedar tops, there lived a weaver named Tafat — whose name meant "light."

Every night she climbed to the highest rock above the village of Aït Benhaddou and unrolled her loom into the darkness. Her shuttle was carved from a fallen star. Her thread was spun from moonlight and morning mist.

The elders said Tafat was not weaving cloth. She was weaving time itself — each geometric pattern a year, each color a season, each knot a human life woven into the great fabric of the Atlas.

Her masterwork — a blanket wide as the horizon — was the night sky itself. The white lines? Those are her warp threads. The stars? The knots where she secured the pattern.

To this day, Amazigh weavers begin every carpet at midnight, under an open sky. They say they are not creating new patterns — they are *reading* Tafat's sky and faithfully copying her design onto wool, so that those who cannot look up may still know the beauty she wove.`},
  {id:"st2",title:"Nile's First Song",culture:"Nubian",genre:"Oral History",
   content:`My grandmother's grandmother told me this story at the banks of the Nile, when the Nile was still the Nile and our village still stood above the water.

Before language, before words, before even the concept of "before" — there was the Nile. Not a river but a living being, older than the sun, wiser than the moon.

The Nile sang. Its voice was the sound of water over smooth stones. The first humans — our ancestors, the Nubian people — were not born from clay or light. We were born from the Nile's listening.

You see, the Nile sang, but no one could hear it. Frustrated, the Nile sang louder, and louder still. The vibration shook loose two handfuls of river mud. These mud-shapes lay on the bank, warming in the sun — and they began to listen.

That is what makes humans human: not the fire we stole, not the tool we invented. We are the creatures who first heard the Nile sing.

This is why Nubian women hum when they draw water. We are not humming — we are answering.`},
];

// ── Utility Components ─────────────────────────────────────────────────────────
function Toast({msg,type="success",onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3500);return()=>clearTimeout(t);},[]);
  const bg=type==="success"?C.success:type==="error"?C.danger:C.info;
  return(
    <div style={{position:"fixed",bottom:28,right:24,zIndex:99999,
      background:bg,color:"white",padding:"12px 20px",borderRadius:12,
      display:"flex",alignItems:"center",gap:9,boxShadow:"0 8px 32px rgba(0,0,0,.2)",
      animation:"slideUp .3s ease",maxWidth:380,fontSize:14,fontWeight:500}}>
      {type==="success"&&<I.CheckCircle s={16} c="white"/>}
      {msg}
    </div>
  );
}

function Modal({children,onClose,maxW=680}){
  return(
    <div className="modal-overlay fade" onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{maxWidth:maxW,width:"100%",maxHeight:"92vh",
        overflow:"auto",background:C.white,borderRadius:20,position:"relative"}}>
        <button onClick={onClose} style={{position:"absolute",top:14,right:14,background:C.bg,
          border:"none",borderRadius:"50%",width:32,height:32,cursor:"pointer",zIndex:10,
          display:"flex",alignItems:"center",justifyContent:"center"}}>
          <I.X s={16} c={C.navy}/>
        </button>
        {children}
      </div>
    </div>
  );
}

function StarRating({n}){
  return<span className="star">{"★".repeat(Math.round(n))}{"☆".repeat(5-Math.round(n))}</span>;
}

// ── Auth Modal ─────────────────────────────────────────────────────────────────
function AuthModal({onClose,onLogin}){
  const [mode,setMode]=useState("login");
  const [f,setF]=useState({name:"",email:"",pass:"",confirmPass:""});
  const [showPass,setShowPass]=useState(false);
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);

  const submit=()=>{
    setErr("");
    if(!f.email||!f.pass){setErr("Please fill all required fields.");return;}
    setLoading(true);
    setTimeout(()=>{
      setLoading(false);
      if(mode==="login"){
        const match=DEMO_ACCOUNTS.find(a=>a.email===f.email&&a.pass===f.pass);
        if(match){onLogin(match);onClose();return;}
        if(f.email&&f.pass.length>=6){onLogin({name:f.name||f.email.split("@")[0],email:f.email,role:"member"});onClose();return;}
        setErr("Invalid credentials.");
      } else {
        if(!f.name){setErr("Please enter your name.");return;}
        if(f.pass!==f.confirmPass){setErr("Passwords do not match.");return;}
        if(f.pass.length<6){setErr("Password must be at least 6 characters.");return;}
        onLogin({name:f.name,email:f.email,role:"member"});onClose();
      }
    },900);
  };

  return(
    <Modal onClose={onClose} maxW={440}>
      <div style={{padding:"36px 32px"}}>
        {/* Logo */}
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{width:48,height:48,background:`linear-gradient(135deg,${C.accent},${C.gold})`,
            borderRadius:13,display:"flex",alignItems:"center",justifyContent:"center",
            margin:"0 auto 12px"}}>
            <I.Globe s={22} c={C.navy}/>
          </div>
          <h2 className="serif" style={{fontSize:24,fontWeight:600,marginBottom:4}}>
            {mode==="login"?"Welcome back":"Join HeritageArk"}
          </h2>
          <p style={{fontSize:13,color:C.muted}}>
            {mode==="login"?"Sign in to your account":"Create your free account"}
          </p>
        </div>

        {/* Toggle */}
        <div style={{display:"flex",background:C.bg,borderRadius:10,padding:4,marginBottom:22}}>
          {["login","signup"].map(m=>(
            <button key={m} onClick={()=>{setMode(m);setErr("");}}
              style={{flex:1,padding:"8px 0",fontSize:13,fontWeight:500,borderRadius:7,
                background:mode===m?C.white:"transparent",
                border:mode===m?"1px solid "+C.border:"none",
                color:mode===m?C.navy:C.muted,cursor:"pointer",
                fontFamily:"'Inter',sans-serif",transition:"all .2s",
                boxShadow:mode===m?"0 1px 6px rgba(0,0,0,.08)":"none"}}>
              {m==="login"?"Sign In":"Create Account"}
            </button>
          ))}
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          {mode==="signup"&&(
            <div>
              <label style={{fontSize:12,fontWeight:500,color:C.muted,display:"block",marginBottom:5}}>Full Name *</label>
              <input value={f.name} onChange={e=>setF(p=>({...p,name:e.target.value}))} placeholder="Your name"/>
            </div>
          )}
          <div>
            <label style={{fontSize:12,fontWeight:500,color:C.muted,display:"block",marginBottom:5}}>Email *</label>
            <input type="email" value={f.email} onChange={e=>setF(p=>({...p,email:e.target.value}))} placeholder="you@example.com"/>
          </div>
          <div>
            <label style={{fontSize:12,fontWeight:500,color:C.muted,display:"block",marginBottom:5}}>Password *</label>
            <div style={{position:"relative"}}>
              <input type={showPass?"text":"password"} value={f.pass} onChange={e=>setF(p=>({...p,pass:e.target.value}))} placeholder="••••••••" style={{paddingRight:44}}/>
              <button onClick={()=>setShowPass(p=>!p)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:C.muted}}>
                <I.Eye s={15} c={C.muted}/>
              </button>
            </div>
          </div>
          {mode==="signup"&&(
            <div>
              <label style={{fontSize:12,fontWeight:500,color:C.muted,display:"block",marginBottom:5}}>Confirm Password *</label>
              <input type="password" value={f.confirmPass} onChange={e=>setF(p=>({...p,confirmPass:e.target.value}))} placeholder="••••••••"/>
            </div>
          )}
          {err&&<div style={{background:"#FEE2E2",color:C.danger,padding:"10px 14px",borderRadius:8,fontSize:13}}>{err}</div>}
          <button className="btn-primary" style={{padding:"13px 0",fontSize:14,marginTop:4}} onClick={submit} disabled={loading}>
            {loading?<I.Refresh s={16} c={C.navy} className="spin"/>:null}
            {loading?"Signing in…":mode==="login"?"Sign In":"Create Account"}
          </button>
        </div>

function Museum(){
  const [sel,setSel]=useState(null);

  const [aiText,setAiText]=useState("");
  const [filter,setFilter]=useState("All");
  const cats=["All","Nubian","Amazigh","Mayan","Ottoman"];

  const list=ARTIFACTS.filter(a=>filter==="All"||a.culture===filter);

  const explainAI=async(artifact)=>{
    setAiExplaining(true);
    setAiText("");
    const fullText=`This remarkable piece — the ${artifact.name} — dates to ${artifact.period} and originates from ${artifact.loc}. Crafted from ${artifact.material} using techniques that took generations to master, it represents the apex of ${artifact.culture} artistic achievement. The ${artifact.dims} object was likely used in ${artifact.culture.toLowerCase()} ceremonial contexts and tells us much about the social and spiritual world of its creators. Today it rests at ${artifact.museum}, its preservation status listed as "${artifact.status}" — a reminder that our work to protect such treasures is never finished.`;
    let i=0;
    const iv=setInterval(()=>{
      i+=2;
      if(i>=fullText.length){setAiText(fullText);setAiExplaining(false);clearInterval(iv);}
      else setAiText(fullText.slice(0,i));
    },30);
  };

  const statusColor=s=>s==="Preserved"?C.success:s==="Restored"?C.info:C.danger;

  return(
    <div>
      {/* Hero */}

function Languages(){
  const [sel,setSel]=useState(null);
  const [quizMode,setQuizMode]=useState(false);
  const [quizIdx,setQuizIdx]=useState(0);
  const [score,setScore]=useState(0);
  const [answered,setAnswered]=useState(null);
  const [practicing,setPracticing]=useState(false);

  const startQuiz=()=>{setQuizMode(true);setQuizIdx(0);setScore(0);setAnswered(null);};

  const answer=(word,choice)=>{
    if(answered!==null)return;
    const correct=choice===word.meaning;
    setAnswered(choice);
    if(correct)setScore(p=>p+1);
    setTimeout(()=>{
      if(quizIdx<sel.lesson.words.length-1){setQuizIdx(p=>p+1);setAnswered(null);}
      else setQuizMode(false);
    },1500);
  };

  const statusCol=s=>s==="Endangered"?C.danger:s==="Vulnerable"?C.warn:C.success;

  return(
    <div>
      {/* Hero */}
      <div style={{background:`linear-gradient(135deg,${C.navy} 0%,#1A1A3A 100%)`,
        padding:"52px 24px 44px"}}>
        <div style={{maxWidth:1200,margin:"0 auto"}}>
          <div className="tag" style={{marginBottom:14,background:"rgba(212,163,115,.2)",color:C.accent}}>
            <I.Book s={11} c={C.accent}/> Heritage Languages
          </div>
          <h1 className="serif" style={{fontSize:"clamp(30px,5vw,52px)",fontWeight:600,color:"white",
            lineHeight:1.1,marginBottom:14}}>
            Every Word Is a<br/><em style={{color:C.gold}}>World Preserved</em>
          </h1>
          <p style={{fontSize:15,color:"rgba(255,255,255,.6)",maxWidth:540,lineHeight:1.75}}>
            Learn endangered languages with AI-powered tutors, voice practice, flashcards, and pronunciation 
            scoring. One word at a time, we keep cultures alive.
          </p>
        </div>
      </div>

      <div style={{maxWidth:1200,margin:"0 auto",padding:"32px 24px"}}>
        {!sel?(
          <>
            {/* Language Cards */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:18}}>
              {LANGUAGES.map(lang=>(
                <div key={lang.id} className="card card-hover lang-glow"
                  style={{padding:"24px",borderLeft:`4px solid ${lang.col}`,transition:"all .25s"}}
                  onClick={()=>{setSel(lang);setQuizMode(false);}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
                    <div style={{fontSize:40}}>{lang.flag}</div>
                    <span style={{padding:"3px 9px",borderRadius:20,fontSize:10,fontWeight:700,
                      background:statusCol(lang.status)+"20",color:statusCol(lang.status),
                      border:`1px solid ${statusCol(lang.status)}30`}}>
                      {lang.status}
                    </span>
                  </div>
                  <h3 style={{fontSize:18,fontWeight:600,marginBottom:4}}>{lang.name}</h3>
                  <p style={{fontSize:12,color:C.muted,marginBottom:10}}>{lang.regions}</p>
                  <div style={{display:"flex",gap:10,fontSize:12,marginBottom:16}}>
                    <span style={{color:C.muted}}>Speakers: <strong style={{color:C.navy}}>{lang.speakers}</strong></span>
                    <span style={{color:C.muted}}>Family: <strong style={{color:C.navy}}>{lang.family}</strong></span>
                  </div>
                  <div style={{background:`${lang.col}12`,border:`1px solid ${lang.col}30`,
                    borderRadius:10,padding:"10px 14px",marginBottom:14}}>
                    <div style={{fontSize:11,color:C.muted,marginBottom:3}}>Hello in {lang.name}:</div>
                    <div style={{fontSize:16,fontWeight:600,color:lang.col}}>{lang.hello}</div>
                    <div style={{fontSize:12,color:C.muted,marginTop:2}}>{lang.hello_script}</div>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    {lang.levels.map(l=>(
                      <span key={l} className="tag" style={{fontSize:10}}>{l}</span>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </>
        ):(
          <div className="fade">
            <button onClick={()=>setSel(null)} style={{background:"none",border:"none",cursor:"pointer",
              display:"flex",alignItems:"center",gap:6,color:C.muted,fontSize:14,marginBottom:20}}>
              <I.ChevLeft s={16} c={C.muted}/> Back to Languages
            </button>

            <div style={{display:"grid",gridTemplateColumns:"minmax(0,2fr) minmax(0,1fr)",gap:24,alignItems:"start"}}>
              {/* Lesson area */}
              <div>
                <div className="card" style={{padding:"24px",marginBottom:20,borderLeft:`4px solid ${sel.col}`}}>
                  <div style={{display:"flex",gap:14,alignItems:"center",marginBottom:20}}>
                    <div style={{fontSize:40}}>{sel.flag}</div>
                    <div>
                      <h2 className="serif" style={{fontSize:24,fontWeight:600}}>{sel.name}</h2>
                      <p style={{fontSize:13,color:C.muted}}>{sel.lesson.title}</p>
                    </div>
                  </div>

                  {!quizMode?(
                    <>
                      <h3 style={{fontSize:15,fontWeight:600,marginBottom:16}}>Vocabulary Flashcards</h3>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
                        {sel.lesson.words.map((w,i)=>(
                          <div key={i} style={{padding:"16px",background:`${sel.col}10`,
                            border:`1px solid ${sel.col}30`,borderRadius:12}}>
                            <div style={{fontSize:20,fontWeight:700,color:sel.col,marginBottom:4}}>{w.word}</div>
                            <div style={{fontSize:13,fontWeight:500,marginBottom:3}}>{w.meaning}</div>
                            <div style={{fontSize:12,color:C.muted}}>{w.phonetic}</div>
                          </div>
                        ))}
                      </div>
                      <button className="btn-primary" style={{padding:"12px 24px",fontSize:14}}
                        onClick={startQuiz}>
                        Start Quiz →
                      </button>
                    </>
                  ):(
                    <div>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:20}}>
                        <h3 style={{fontSize:15,fontWeight:600}}>Quiz — Word {quizIdx+1}/{sel.lesson.words.length}</h3>
                        <span style={{fontSize:13,color:C.muted}}>Score: {score}/{quizIdx}</span>
                      </div>
                      <div style={{background:C.bg,borderRadius:14,padding:"24px",textAlign:"center",marginBottom:20}}>
                        <div style={{fontSize:32,fontWeight:700,color:sel.col,marginBottom:6}}>
                          {sel.lesson.words[quizIdx].word}
                        </div>
                        <div style={{fontSize:13,color:C.muted}}>{sel.lesson.words[quizIdx].phonetic}</div>
                      </div>
                      <p style={{fontSize:14,fontWeight:500,marginBottom:12,textAlign:"center"}}>What does this word mean?</p>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                        {[sel.lesson.words[quizIdx].meaning,
                          ...sel.lesson.words.filter((_,i)=>i!==quizIdx).slice(0,3).map(w=>w.meaning)]
                          .sort(()=>Math.random()-.5)
                          .map((choice,i)=>{
                            const correct=answered&&choice===sel.lesson.words[quizIdx].meaning;
                            const wrong=answered===choice&&choice!==sel.lesson.words[quizIdx].meaning;
                            return(
                              <button key={i} onClick={()=>answer(sel.lesson.words[quizIdx],choice)}
                                style={{padding:"12px 16px",borderRadius:10,border:`2px solid ${
                                  correct?C.success:wrong?C.danger:C.border}`,
                                  background:correct?"#D1FAE5":wrong?"#FEE2E2":C.white,
                                  cursor:"pointer",fontFamily:"'Inter',sans-serif",fontSize:14,
                                  fontWeight:500,transition:"all .2s",
                                  color:correct?C.success:wrong?C.danger:C.navy}}>
                                {choice}
                              </button>
                            );
                          })}
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {/* Sidebar */}
              <div style={{display:"flex",flexDirection:"column",gap:14}}>
                <div className="card" style={{padding:"18px"}}>
                  <h4 style={{fontSize:13,fontWeight:600,marginBottom:12}}>Language Profile</h4>
                  {[["Speakers",sel.speakers],["Family",sel.family],["Regions",sel.regions],["Status",sel.status]].map(([l,v])=>(
                    <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",
                      borderBottom:"1px solid "+C.border,fontSize:13}}>
                      <span style={{color:C.muted}}>{l}</span>
                      <strong>{v}</strong>
                    </div>
                  ))}
                </div>
                <div className="card" style={{padding:"18px",background:`${sel.col}08`}}>
                  <h4 style={{fontSize:13,fontWeight:600,marginBottom:10}}>Greeting</h4>
                  <div style={{fontSize:22,fontWeight:700,color:sel.col,marginBottom:4}}>{sel.hello}</div>
                  <div style={{fontSize:16,color:C.muted}}>{sel.hello_script}</div>
                </div>
                <div className="card" style={{padding:"16px",background:"#F0F9FF",border:"1px solid #BAE6FD"}}>
                  <h4 style={{fontSize:12,fontWeight:600,color:"#0369A1",marginBottom:8}}>Full Platform Features</h4>
                  <ul style={{fontSize:12,color:"#0369A1",paddingLeft:16,lineHeight:1.9}}>
                    <li>AI voice tutor</li>
                    <li>Pronunciation scoring</li>
                    <li>Story reading</li>
                    <li>Progress tracking</li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

    nubian:`The Nubian people are one of the world's oldest civilizations, with roots along the Nile Valley stretching back over 3,000 years. The Kingdom of Kush (1070 BCE–350 CE) was a major African empire that ruled Egypt during the 25th Dynasty.

🏛️ **Heritage highlights:**
- **Language:** Nobiin (northern Nubia) and Kenzi are the primary Nubian languages, both endangered with around 5 million speakers
- **Crafts:** Gold jewelry, blue-painted pottery, and embroidered garments are hallmarks of Nubian artistry
- **Music:** The *doum doum* drum and traditional wedding songs preserve ancient rhythms
- **Architecture:** Nubian houses feature distinctive colorful murals on exterior walls

⚠️ A major tragedy occurred with the 1964 construction of the Aswan High Dam, which flooded over 40 Nubian villages, displacing 60,000–100,000 people and submerging irreplaceable heritage sites.

Today, Nubian communities maintain strong cultural identity through festivals, language revival programs, and diaspora networks.`,

    amazigh:`The Amazigh (Berber) peoples are the indigenous inhabitants of North Africa, predating Arab conquest by thousands of years. The name "Amazigh" means "free people" in the Tamazight language.

✍️ **The Tifinagh Script:**
Tifinagh is one of the world's oldest writing systems, dating back over 2,500 years. Unlike most alphabets, it remained in continuous (if limited) use throughout history. Today it is officially recognized in Morocco and Algeria.

🏔️ **Cultural pillars:**
- **Textile:** Amazigh women are master weavers — each carpet is a visual autobiography encoding clan identity
- **Music:** The *ahwach* circle dance and *ahouach* percussion traditions are UNESCO-listed
- **Architecture:** Ksour (fortified villages) and kasbahs of the Atlas are architectural masterpieces
- **Oral poetry:** The female poet tradition (*tizamarin*) preserves history in verse

With 8+ million speakers, Tamazight is growing — Morocco added it as an official language in 2011.`,

    kente:`Kente cloth is one of Africa's most globally recognized textiles, originating with the Akan people of Ghana (particularly the Asante kingdom) in the 17th century.

🧵 **The weaving process:**
Kente is woven on narrow 4-inch strip looms, with each strip approximately 3 inches wide. These strips are then sewn together to create the full cloth. The craft requires years of apprenticeship.

🎨 **Color symbolism:**
- **Gold (Sika dwa):** Royalty, wealth, high status
- **Green (Akoben):** Growth, renewal, prosperity  
- **Red (Ohia):** Political strength, bloodshed, mourning
- **Blue (Dua oti):** Peace, harmony, love
- **White:** Purity, spiritual cleanliness

👑 **Royal significance:**
Originally, only Akan royalty were permitted to wear Kente. Today it is a pan-African symbol of pride and is worn at graduations, weddings, and diaspora events worldwide.`,

    mayan:`The Maya civilization flourished from approximately 250–900 CE (Classic Period) across present-day Mexico, Guatemala, Belize, Honduras, and El Salvador. With 6-7 million living descendants, it is very much alive today.

📅 **Calendar system:**
The Maya developed two calendars: the 365-day *Haab'* (solar) and the 260-day *Tzolk'in* (ritual). Combined, they created a 52-year cycle called the Calendar Round. The Long Count calendar tracked over 5,000 years of history.

📝 **Writing:**
The Maya developed the only fully-developed writing system in the pre-Columbian Americas. Hieroglyphic inscriptions carved on stelae, temples, and codices record history, mythology, and ritual.

🌽 **Living culture:**
Today, Mayan communities in the Yucatan, Chiapas, and Guatemala maintain many traditions: traditional dress (*huipil*), oral literature, plant medicine, and agricultural ceremonies tied to the maize cycle.`,

    default:`That's a fascinating question about cultural heritage! Here's what I can share:

Heritage preservation is about more than saving objects — it's about maintaining the living connections between communities and their histories. This includes:

🗣️ **Oral traditions** — Stories passed from grandmother to grandchild, encoding values, history, and ecological knowledge

👘 **Material culture** — Clothing, tools, and crafts that encode cultural identity in physical form

🎵 **Performing arts** — Music, dance, and ritual that can only be learned by doing

🌐 **Languages** — Each language is a unique lens on human experience; we lose one every two weeks

What specific culture or topic would you like to explore? I can tell you about Nubian, Amazigh, Mayan, Kurdish, Sami, Andean, Akan/Kente, and many more civilizations.`
  };

  const getResponse=async(q)=>{
    const ql=q.toLowerCase();
    if(ql.includes("nubian")||ql.includes("nile")||ql.includes("kerma"))return KB.nubian;
    if(ql.includes("amazigh")||ql.includes("berber")||ql.includes("tamazight")||ql.includes("tifinagh"))return KB.amazigh;
    if(ql.includes("kente")||ql.includes("akan")||ql.includes("ghana"))return KB.kente;
    if(ql.includes("maya")||ql.includes("mayan")||ql.includes("calendar"))return KB.mayan;

    // Claude API call
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-6",max_tokens:1000,
          system:`You are the HeritageArk AI Cultural Guide — a warm, knowledgeable expert in world cultures, indigenous heritage, endangered languages, traditional craftsmanship, and archaeological history.

Your mission: Preserve and share knowledge about human cultural heritage, with special focus on Nubian, Amazigh, Kurdish, Sami, Mayan, Andean, Akan, and Ottoman cultures.

Guidelines:
- Speak as a passionate cultural educator, not a textbook
- Use cultural empathy and respect for indigenous perspectives
- Include specific details: dates, places, names, techniques
- Mention threats to heritage when relevant (colonialism, displacement, urbanization)
- Use occasional emojis to highlight key points
- Support English and Arabic responses based on what language the user writes in
- Current language preference: ${lang}`,
          messages:[{role:"user",content:q}]
        })
      });
      const d=await res.json();
      return d.content?.[0]?.text||KB.default;
    }catch{return KB.default;}
  };

  const send=async()=>{
    if(!input.trim()||loading)return;
    const q=input.trim();
    setInput("");
    setMsgs(p=>[...p,{role:"user",text:q}]);
    setLoading(true);
    const resp=await getResponse(q);
    setLoading(false);
    // Stream effect
    setMsgs(p=>[...p,{role:"ai",text:"",streaming:true}]);
    let i=0;
    const iv=setInterval(()=>{
      i+=3;
      if(i>=resp.length){
        clearInterval(iv);
        setMsgs(p=>{const a=[...p];a[a.length-1]={role:"ai",text:resp};return a;});
      }else{
        setMsgs(p=>{const a=[...p];a[a.length-1]={role:"ai",text:resp.slice(0,i),streaming:true};return a;});
      }
    },20);
  };

  const renderText=t=>t.split('\n').map((line,i)=>{
    let processed=line
      .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.*?)\*/g,'<em>$1</em>');
    return<p key={i} style={{marginBottom:6,lineHeight:1.7}} dangerouslySetInnerHTML={{__html:processed}}/>;
  });

  return(
    <div style={{maxWidth:900,margin:"0 auto",padding:"32px 24px"}}>
      <div style={{textAlign:"center",marginBottom:28}}>
        <div style={{width:56,height:56,background:`linear-gradient(135deg,${C.accent},${C.gold})`,
          borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",
          margin:"0 auto 12px"}}>
          <I.Bot s={26} c={C.navy}/>
        </div>
        <h1 className="serif" style={{fontSize:30,fontWeight:600,marginBottom:6}}>AI Heritage Guide</h1>
        <p style={{fontSize:14,color:C.muted}}>Ask me anything about indigenous cultures, languages, artifacts, and oral histories</p>
        {/* Language toggle */}
        <div style={{display:"flex",gap:8,justifyContent:"center",marginTop:12}}>
          {["English","Arabic","French"].map(l=>(
            <button key={l} onClick={()=>setLang(l)}
              style={{padding:"5px 14px",border:`1.5px solid ${lang===l?C.accent:C.border}`,
                borderRadius:20,background:lang===l?C.accent:"white",
                color:lang===l?C.navy:C.muted,cursor:"pointer",
                fontFamily:"'Inter',sans-serif",fontSize:12,fontWeight:500}}>
              {l}
            </button>
          ))}
        </div>
      </div>

      {/* Suggestions */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16,justifyContent:"center"}}>
        {suggestions.map(s=>(
          <button key={s} onClick={()=>{setInput(s);}}
            style={{padding:"6px 14px",background:C.white,border:"1px solid "+C.border,
              borderRadius:20,cursor:"pointer",fontFamily:"'Inter',sans-serif",
              fontSize:12,color:C.muted,transition:"all .2s"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor=C.accent}
            onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
            {s}
          </button>
        ))}
      </div>

      {/* Chat window */}
      <div ref={scrollRef} style={{height:440,overflowY:"auto",
        background:C.white,border:"1px solid "+C.border,borderRadius:16,
        padding:"20px",marginBottom:12,display:"flex",flexDirection:"column",gap:16}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",gap:10,flexDirection:m.role==="user"?"row-reverse":"row",
            animation:"slideUp .3s ease"}}>
            <div style={{width:34,height:34,borderRadius:"50%",flexShrink:0,
              background:m.role==="user"?C.navy:`linear-gradient(135deg,${C.accent},${C.gold})`,
              display:"flex",alignItems:"center",justifyContent:"center",marginTop:2}}>
              {m.role==="user"
                ?<span style={{color:"white",fontSize:14,fontWeight:700}}>U</span>
                :<I.Bot s={16} c={C.navy}/>}
            </div>
            <div style={{maxWidth:"76%",padding:"14px 16px",
              background:m.role==="user"?C.navy:C.bg,
              color:m.role==="user"?"white":C.navy,
              borderRadius:m.role==="user"?"16px 4px 16px 16px":"4px 16px 16px 16px",
              fontSize:14,lineHeight:1.6}}>
              {m.role==="ai"?renderText(m.text):<p>{m.text}</p>}
              {m.streaming&&<span className="ai-cursor" style={{fontSize:16}}>|</span>}
            </div>
          </div>
        ))}
        {loading&&!msgs[msgs.length-1]?.streaming&&(
          <div style={{display:"flex",gap:10}}>
            <div style={{width:34,height:34,borderRadius:"50%",
              background:`linear-gradient(135deg,${C.accent},${C.gold})`,
              display:"flex",alignItems:"center",justifyContent:"center"}}>
              <I.Bot s={16} c={C.navy}/>
            </div>
            <div style={{padding:"14px 18px",background:C.bg,borderRadius:"4px 16px 16px 16px"}}>
              <div style={{display:"flex",gap:5,alignItems:"center"}}>
                {[0,1,2].map(i=>(
                  <div key={i} style={{width:6,height:6,borderRadius:"50%",background:C.muted,
                    animation:`pulse 1s ease-in-out ${i*.2}s infinite`}}/>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Input */}
      <div style={{display:"flex",gap:10}}>
        <input value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()}
          placeholder="Ask about any culture, language, artifact, or tradition…"
          style={{flex:1}}/>
        <button className="btn-primary" style={{padding:"10px 18px",flexShrink:0}}
          onClick={send} disabled={loading||!input.trim()}>
          <I.Send s={16} c={C.navy}/>
        </button>
      </div>
    </div>
  );
}

function AIStories(){
  const [form,setForm]=useState({culture:"",topic:"",genre:"Legend",length:"medium"});
  const [generating,setGenerating]=useState(false);
  const [story,setStory]=useState(null);
  const [viewStory,setViewStory]=useState(null);
  const [storyText,setStoryText]=useState("");

  const genres=["Legend","Folktale","Oral History","Creation Myth","Love Story","Epic"];
  const lengths=[{id:"short",label:"Short (~200 words)"},{id:"medium",label:"Medium (~400 words)"},{id:"long",label:"Long (~700 words)"}];

  const generate=async()=>{
    if(!form.culture||!form.topic){alert("Please fill in Culture and Topic");return;}
    setGenerating(true);setStory(null);setStoryText("");

    const prompt=`You are a masterful oral storyteller specializing in indigenous and world cultural heritage narratives.

Write a ${form.genre.toLowerCase()} in the tradition of the ${form.culture} culture, about: "${form.topic}".

Length: ${form.length==="short"?"200 words":form.length==="medium"?"400 words":"700 words"}

Guidelines:
- Write in a rich, lyrical oral tradition style — as if spoken aloud by an elder
- Include specific cultural details, place names, and traditional elements
- Weave in themes of nature, community, identity, and ancestral wisdom
- Use present tense for timeless mythological elements
- The story should feel authentic, not invented — draw on real cultural patterns
- Do NOT add a title or "The End" — just the story body

Begin directly with the story:`;

    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-6",max_tokens:1500,
          messages:[{role:"user",content:prompt}]
        })
      });
      const d=await res.json();
      const text=d.content?.[0]?.text||STORIES[0].content;
      setGenerating(false);
      const newStory={id:"gen_"+Date.now(),title:`${form.topic} — A ${form.culture} ${form.genre}`,
        culture:form.culture,genre:form.genre,content:text};
      setStory(newStory);
      // Stream
      let i=0;
      const iv=setInterval(()=>{
        i+=4;
        if(i>=text.length){setStoryText(text);clearInterval(iv);}
        else setStoryText(text.slice(0,i));
      },15);
    }catch{
      setGenerating(false);
      const fallback=STORIES[Math.floor(Math.random()*STORIES.length)];
      setStory(fallback);
      let i=0;
      const iv=setInterval(()=>{
        i+=4;if(i>=fallback.content.length){setStoryText(fallback.content);clearInterval(iv);}
        else setStoryText(fallback.content.slice(0,i));
      },15);
    }
  };

  return(
    <div>
      {/* Hero */}
      <div style={{background:`linear-gradient(160deg,${C.navy} 0%,#2D1A0A 100%)`,
        padding:"52px 24px 44px"}}>
        <div style={{maxWidth:1200,margin:"0 auto"}}>
          <div className="tag" style={{marginBottom:14,background:"rgba(212,163,115,.2)",color:C.accent}}>
            <I.Sparkles s={11} c={C.accent}/> AI Story Generator
          </div>
          <h1 className="serif" style={{fontSize:"clamp(30px,5vw,52px)",fontWeight:600,color:"white",
            lineHeight:1.1,marginBottom:14}}>
            Legends Reborn<br/><em style={{color:C.gold}}>by AI</em>
          </h1>
          <p style={{fontSize:15,color:"rgba(255,255,255,.6)",maxWidth:540,lineHeight:1.75}}>
            Generate cultural stories, oral histories, creation myths, and folktales — in the authentic 
            voice of any tradition. Powered by Claude AI.
          </p>
        </div>
      </div>

      <div style={{maxWidth:1000,margin:"0 auto",padding:"36px 24px"}}>
        <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,1.6fr)",gap:28,alignItems:"start"}}>
          {/* Generator form */}
          <div>
            <div className="card" style={{padding:"24px",marginBottom:20}}>
              <h3 style={{fontSize:16,fontWeight:600,marginBottom:18}}>Story Generator</h3>
              <div style={{display:"flex",flexDirection:"column",gap:14}}>
                <div>
                  <label style={{fontSize:12,fontWeight:600,color:C.muted,display:"block",marginBottom:5,
                    textTransform:"uppercase",letterSpacing:".05em"}}>Culture / People *</label>
                  <input value={form.culture} onChange={e=>setForm(p=>({...p,culture:e.target.value}))}
                    placeholder="e.g. Nubian, Amazigh, Mayan…"/>
                </div>
                <div>
                  <label style={{fontSize:12,fontWeight:600,color:C.muted,display:"block",marginBottom:5,
                    textTransform:"uppercase",letterSpacing:".05em"}}>Story Topic *</label>
                  <input value={form.topic} onChange={e=>setForm(p=>({...p,topic:e.target.value}))}
                    placeholder="e.g. the origin of weaving, a river spirit…"/>
                </div>
                <div>
                  <label style={{fontSize:12,fontWeight:600,color:C.muted,display:"block",marginBottom:5,
                    textTransform:"uppercase",letterSpacing:".05em"}}>Genre</label>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {genres.map(g=>(
                      <button key={g} onClick={()=>setForm(p=>({...p,genre:g}))}
                        style={{padding:"6px 12px",border:`1.5px solid ${form.genre===g?C.accent:C.border}`,
                          borderRadius:20,background:form.genre===g?`${C.accent}20`:"white",
                          color:form.genre===g?C.navy:C.muted,cursor:"pointer",
                          fontFamily:"'Inter',sans-serif",fontSize:12,fontWeight:500,transition:"all .2s"}}>
                        {g}
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <label style={{fontSize:12,fontWeight:600,color:C.muted,display:"block",marginBottom:5,
                    textTransform:"uppercase",letterSpacing:".05em"}}>Length</label>
                  <select value={form.length} onChange={e=>setForm(p=>({...p,length:e.target.value}))}>
                    {lengths.map(l=><option key={l.id} value={l.id}>{l.label}</option>)}
                  </select>
                </div>
                <button className="btn-primary" style={{padding:"13px 0",fontSize:14,display:"flex",
                  alignItems:"center",justifyContent:"center",gap:8}}
                  onClick={generate} disabled={generating}>
                  {generating?<I.Refresh s={15} c={C.navy} className="spin"/>:<I.Sparkles s={15} c={C.navy}/>}
                  {generating?"Weaving the story…":"Generate Story"}
                </button>
              </div>
            </div>

            {/* Pre-existing stories */}
            <h4 style={{fontSize:13,fontWeight:600,marginBottom:10}}>Example Stories</h4>
            {STORIES.map(s=>(
              <div key={s.id} className="card card-hover" style={{padding:"14px 16px",marginBottom:10}}
                onClick={()=>setViewStory(s)}>
                <h5 style={{fontSize:14,fontWeight:600,marginBottom:4}}>{s.title}</h5>
                <div style={{display:"flex",gap:8}}>
                  <span className="tag" style={{fontSize:10}}>{s.culture}</span>
                  <span className="tag-blue" style={{display:"inline-flex",padding:"3px 9px",
                    borderRadius:20,fontSize:10,fontWeight:600,
                    background:"rgba(37,99,235,.1)",color:"#1E40AF"}}>{s.genre}</span>
                </div>
              </div>
            ))}
          </div>

          {/* Story display */}
          <div>
            {story?(
              <div className="card fade" style={{padding:"28px"}}>
                <div className="tag" style={{marginBottom:10}}>{story.culture} · {story.genre}</div>
                <h2 className="serif" style={{fontSize:22,fontWeight:600,marginBottom:20,lineHeight:1.3}}>
                  {story.title}
                </h2>
                <div style={{fontSize:15,lineHeight:2,color:C.navy,
                  whiteSpace:"pre-wrap",fontFamily:"'Playfair Display',serif",
                  borderLeft:`3px solid ${C.accent}`,paddingLeft:18}}>
                  {storyText}
                  {storyText.length<(story?.content||"").length&&
                    <span className="ai-cursor"/>}
                </div>
                {storyText===story.content&&(
                  <div style={{marginTop:20,display:"flex",gap:10,flexWrap:"wrap"}}>
                    <button className="btn-ghost" style={{padding:"9px 16px",fontSize:13,
                      display:"flex",alignItems:"center",gap:6}}>
                      <I.Volume s={14} c={C.navy}/>Audio Narration
                    </button>
                    <button className="btn-ghost" style={{padding:"9px 16px",fontSize:13,
                      display:"flex",alignItems:"center",gap:6}}>
                      <I.Share s={14} c={C.navy}/>Share
                    </button>
                    <button className="btn-primary" style={{padding:"9px 16px",fontSize:13,
                      display:"flex",alignItems:"center",gap:6}}
                      onClick={()=>{setStory(null);setStoryText("");}}>
                      <I.Plus s={14} c={C.navy}/>New Story
                    </button>
                  </div>
                )}
              </div>
            ):(
              <div className="card" style={{padding:"40px",textAlign:"center",minHeight:300,
                display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                <div style={{fontSize:56,marginBottom:16}}>📜</div>
                <h3 className="serif" style={{fontSize:20,fontWeight:600,marginBottom:8}}>
                  Stories Waiting to be Born
                </h3>
                <p style={{fontSize:14,color:C.muted,maxWidth:280,lineHeight:1.7}}>
                  Choose a culture and topic on the left, then let AI weave a story in authentic oral tradition style.
                </p>
              </div>
            )}
          </div>
        </div>
      </div>

      {/* View story modal */}
      {viewStory&&(
        <Modal onClose={()=>setViewStory(null)} maxW={680}>
          <div style={{padding:"32px"}}>
            <div className="tag" style={{marginBottom:10}}>{viewStory.culture} · {viewStory.genre}</div>
            <h2 className="serif" style={{fontSize:22,fontWeight:600,marginBottom:20}}>{viewStory.title}</h2>
            <div style={{fontSize:15,lineHeight:2,whiteSpace:"pre-wrap",
              fontFamily:"'Playfair Display',serif",
              borderLeft:`3px solid ${C.accent}`,paddingLeft:18}}>
              {viewStory.content}
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── CREATOR DASHBOARD ─────────────────────────────────────────────────────────
function CreatorDashboard({videos,setVideos,session,toast}){
  const [file,setFile]=useState(null);
  const [preview,setPreview]=useState(null);
  const [uploading,setUploading]=useState(false);
  const [pct,setPct]=useState(0);
  const [form,setForm]=useState({title:"",culture:"",cat:"Documentary",desc:""});
  const fileRef=useRef(null);
  const cats=["Documentary","Ceremony","Language","Music","Crafts","Architecture","Textile"];
  const mine=videos.filter(v=>isAdmin(session)||v.uploader===session.name);

  const handleFile=e=>{
    const f=e.target.files[0];if(!f)return;
    setFile(f);setPreview(URL.createObjectURL(f));
    if(!form.title)setForm(p=>({...p,title:f.name.replace(/\.[^.]+$/,"").replace(/[-_]/g," ")}));
  };

  const upload=()=>{
    if(!form.title||!file){toast("Please add a title and select a file","error");return;}
    setUploading(true);setPct(0);
    const iv=setInterval(()=>{
      setPct(p=>{
        if(p>=100){
          clearInterval(iv);setUploading(false);
          const nv={id:"v"+Date.now(),title:form.title,culture:form.culture||"Unknown",
            cat:form.cat,desc:form.desc,uploader:session.name,role:session.role,
            url:preview,emoji:"🎬",bg:"#F8F5F0",views:0,likes:0,dur:"--:--",
            published:can(session,"moderate")};
          setVideos(pr=>[nv,...pr]);
          setForm({title:"",culture:"",cat:"Documentary",desc:""});
          setFile(null);setPreview(null);
          toast(can(session,"moderate")?"Video published!":"Submitted for review","success");
          return 100;
        }
        return p+Math.random()*8+3;
      });
    },100);
  };

  const del=id=>{if(!window.confirm("Delete?"))return;setVideos(p=>p.filter(v=>v.id!==id));toast("Deleted");};
  const togglePub=id=>{setVideos(p=>p.map(v=>v.id===id?{...v,published:!v.published}:v));toast("Updated");};

  return(
    <div style={{maxWidth:1200,margin:"0 auto",padding:"40px 24px"}}>
      <div style={{marginBottom:28}}>
        <h1 className="serif" style={{fontSize:34,fontWeight:600,marginBottom:5}}>Creator Studio</h1>
        <p style={{color:C.muted,fontSize:15}}>Upload and manage your heritage documentary content</p>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) 340px",gap:28}}>
        {/* Upload form */}
        <div>
          <div className="card" style={{padding:"26px",marginBottom:22}}>
            <h3 style={{fontSize:16,fontWeight:600,marginBottom:18}}>Upload New Film</h3>
            <div onDrop={e=>{e.preventDefault();handleFile({target:{files:e.dataTransfer.files}})}}
              onDragOver={e=>e.preventDefault()} onClick={()=>!file&&fileRef.current?.click()}
              style={{border:`2px dashed ${file?C.accent:C.border}`,borderRadius:14,
                padding:"26px 20px",textAlign:"center",
                background:file?`${C.accent}10`:"#FAFAFA",
                cursor:file?"default":"pointer",marginBottom:20,transition:"all .3s"}}>
              {uploading?(
                <div>
                  <I.Refresh s={32} c={C.accent} className="spin" style={{margin:"0 auto 12px",display:"block"}}/>
                  <p style={{fontSize:15,fontWeight:600,marginBottom:10}}>Uploading to Heritage Archive…</p>
                  <div className="progress"><div className="progress-bar" style={{width:`${Math.min(pct,100)}%`,background:C.accent}}/></div>
                  <p style={{fontSize:12,color:C.muted,marginTop:7}}>{Math.min(Math.round(pct),100)}%</p>
                </div>
              ):file?(
                <div>
                  <video src={preview} style={{maxHeight:140,maxWidth:"100%",borderRadius:9,marginBottom:10}} muted controls/>
                  <p style={{fontSize:14,fontWeight:600,color:C.navy,marginBottom:3}}>{file.name}</p>
                  <p style={{fontSize:12,color:C.muted,marginBottom:9}}>{(file.size/1024/1024).toFixed(1)} MB</p>
                  <button className="btn-ghost" style={{padding:"6px 13px",fontSize:12}}
                    onClick={e=>{e.stopPropagation();setFile(null);setPreview(null);}}>
                    Change file
                  </button>
                </div>
              ):(
                <div>
                  <div style={{width:54,height:54,background:`${C.accent}20`,borderRadius:"50%",
                    display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px"}}>
                    <I.Upload s={23} c={C.accent}/>
                  </div>
                  <p style={{fontSize:15,fontWeight:600,marginBottom:4}}>Drop your footage here</p>
                  <p style={{fontSize:13,color:C.muted,marginBottom:16}}>MP4, MOV, AVI — up to 50 GB</p>
                  <button className="btn-primary" style={{padding:"9px 20px",fontSize:13}}>Browse Files</button>
                </div>
              )}
              <input ref={fileRef} type="file" accept="video/*" style={{display:"none"}} onChange={handleFile}/>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:13}}>
              <div>

// ── CULTURAL DNA DISCOVERY ─────────────────────────────────────────────────────
function CulturalDNA({go}){
  const [step,setStep]=useState(0);
  const [scores,setScores]=useState({});
  const [result,setResult]=useState(null);

  const answer=(weights)=>{
    setScores(prev=>{
      const next={...prev};
      Object.entries(weights).forEach(([k,v])=>{next[k]=(next[k]||0)+v;});
      return next;
    });
    if(step<DNA_QUESTIONS.length-1){
      setStep(s=>s+1);
    }else{
      setScores(finalScores=>{
        const top=Object.entries(finalScores).sort((a,b)=>b[1]-a[1])[0];
        setResult(DNA_RESULTS[top?.[0]]||DNA_RESULTS.nubian);
        return finalScores;
      });
    }
  };

  const restart=()=>{setStep(0);setScores({});setResult(null);};

  return(
    <div>
      <div style={{background:`linear-gradient(135deg,${C.navy} 0%,#2A1A3A 100%)`,padding:"52px 24px 44px"}}>
        <div style={{maxWidth:900,margin:"0 auto"}}>
          <div className="tag" style={{marginBottom:14,background:"rgba(212,163,115,.2)",color:C.accent}}>
            <I.Dna s={11} c={C.accent}/> Cultural DNA Discovery
          </div>
          <h1 className="serif" style={{fontSize:"clamp(28px,5vw,46px)",fontWeight:600,color:"white",
            lineHeight:1.1,marginBottom:14}}>
            Which Heritage<br/><em style={{color:C.gold}}>Resonates With You?</em>
          </h1>
          <p style={{fontSize:15,color:"rgba(255,255,255,.6)",maxWidth:520,lineHeight:1.75}}>
            A short, playful quiz matching your instincts and values to a cultural tradition — 
            a starting point for deeper exploration, not a label.
          </p>
        </div>
      </div>

      <div style={{maxWidth:680,margin:"0 auto",padding:"40px 24px"}}>
        {!result?(
          <div className="card fade" style={{padding:"32px"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:20}}>
              <span style={{fontSize:13,color:C.muted,fontWeight:600}}>
                Question {step+1} of {DNA_QUESTIONS.length}
              </span>
              <div style={{display:"flex",gap:4}}>
                {DNA_QUESTIONS.map((_,i)=>(
                  <div key={i} style={{width:24,height:4,borderRadius:2,
                    background:i<=step?C.accent:C.border}}/>
                ))}
              </div>
            </div>
            <h2 className="serif" style={{fontSize:22,fontWeight:600,marginBottom:24,lineHeight:1.4}}>
              {DNA_QUESTIONS[step].text}
            </h2>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {DNA_QUESTIONS[step].options.map((o,i)=>(
                <button key={i} onClick={()=>answer(o.weights)}
                  style={{padding:"15px 18px",textAlign:"left",borderRadius:12,
                    border:"1.5px solid "+C.border,background:C.white,cursor:"pointer",
                    fontFamily:"'Inter',sans-serif",fontSize:14,transition:"all .2s"}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor=C.accent;e.currentTarget.style.background=`${C.accent}08`;}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.background=C.white;}}>
                  {o.label}
                </button>
              ))}
            </div>
          </div>
        ):(
          <div className="card fade" style={{padding:"36px",textAlign:"center"}}>
            <div style={{fontSize:56,marginBottom:14}}>{result.flag}</div>
            <div className="tag" style={{marginBottom:10}}>Your Cultural Resonance</div>
            <h2 className="serif" style={{fontSize:28,fontWeight:600,marginBottom:16}}>{result.name}</h2>
            <p style={{fontSize:15,color:C.muted,lineHeight:1.8,maxWidth:460,margin:"0 auto 24px"}}>

            </p>

              color:"#0369A1",border:"1px solid #BAE6FD",marginBottom:24,textAlign:"left"}}>
              This is a playful starting point for cultural curiosity, not a claim of ancestry, 
              identity, or belonging — every culture welcomes respectful, consensual learning.
            </div>

  return(
    <div>
      <div style={{background:`linear-gradient(135deg,${C.navy} 0%,#2A1A0A 100%)`,padding:"52px 24px 44px"}}>
        <div style={{maxWidth:1200,margin:"0 auto"}}>
          <div className="tag" style={{marginBottom:14,background:"rgba(212,163,115,.2)",color:C.accent}}>
            <I.Sparkles s={11} c={C.accent}/> Art for Preservation
          </div>
          <h1 className="serif" style={{fontSize:"clamp(28px,5vw,46px)",fontWeight:600,color:"white",
            lineHeight:1.1,marginBottom:14}}>
            Art That Funds<br/><em style={{color:C.gold}}>the Field Work</em>
          </h1>
          <p style={{fontSize:15,color:"rgba(255,255,255,.6)",maxWidth:540,lineHeight:1.75}}>
            Limited-edition prints and digital art derived from archived cultural material — 
            every purchase directly funds an active preservation expedition.
          </p>
        </div>
      </div>

      <div style={{maxWidth:1200,margin:"0 auto",padding:"32px 24px"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:20}}>
          {ART_CAMPAIGNS.map(ac=>{
            const pct=Math.min(100,Math.round((ac.raised/ac.goal)*100));
            return(
              <div key={ac.id} className="card card-hover" style={{overflow:"hidden"}} onClick={()=>setSel(ac)}>
                <div style={{height:200,background:`${ac.col}25`,display:"flex",alignItems:"center",
                  justifyContent:"center",fontSize:72}}>{ac.emoji}</div>
                <div style={{padding:"18px"}}>
                  <div className="tag" style={{marginBottom:8,fontSize:10}}>{ac.culture}</div>
                  <h3 style={{fontSize:16,fontWeight:600,marginBottom:4}}>{ac.title}</h3>
                  <p style={{fontSize:12,color:C.muted,marginBottom:12}}>By {ac.artist}</p>
                  <div style={{marginBottom:10}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:5}}>
                      <strong>${ac.raised.toLocaleString()}</strong>
                      <span style={{color:C.muted}}>of ${ac.goal.toLocaleString()}</span>
                    </div>
                    <div className="progress"><div className="progress-bar" style={{width:`${pct}%`,
                      background:pct>=100?C.success:ac.col}}/></div>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.muted}}>
                    <span>{pct}% funded</span>
                    <span>{ac.backers} backers</span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {sel&&(
        <Modal onClose={()=>setSel(null)} maxW={600}>
          <div>
            <div style={{height:220,background:`${sel.col}25`,display:"flex",alignItems:"center",
              justifyContent:"center",fontSize:88,borderRadius:"20px 20px 0 0"}}>{sel.emoji}</div>
            <div style={{padding:"24px 28px 28px"}}>
              <div className="tag" style={{marginBottom:10}}>{sel.culture}</div>
              <h2 className="serif" style={{fontSize:22,fontWeight:600,marginBottom:6}}>{sel.title}</h2>
              <p style={{fontSize:13,color:C.muted,marginBottom:16}}>By {sel.artist}</p>
              <p style={{fontSize:14,lineHeight:1.8,marginBottom:20}}>{sel.desc}</p>
              <div style={{background:C.bg,borderRadius:12,padding:"16px",marginBottom:20}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:14,marginBottom:8}}>
                  <strong>${sel.raised.toLocaleString()} raised</strong>
                  <span style={{color:C.muted}}>Goal: ${sel.goal.toLocaleString()}</span>
                </div>
                <div className="progress"><div className="progress-bar" style={{
                  width:`${Math.min(100,(sel.raised/sel.goal)*100)}%`,background:sel.col}}/></div>
                <p style={{fontSize:12,color:C.muted,marginTop:8}}>{sel.backers} backers supporting this campaign</p>
              </div>
              <button className="btn-primary" style={{width:"100%",padding:"13px 0",fontSize:14}}
                onClick={()=>back(sel)}>
                Back This Campaign
              </button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── APP ROOT ───────────────────────────────────────────────────────────────────
function App(){
  const [page,setPage]=useState("home");
  const [session,setSession]=useState(null);
  const [authOpen,setAuthOpen]=useState(false);
  const [videos,setVideos]=useState(DOCUMENTARIES);
  const [users,setUsers]=useState([]);
  const [toastState,setToastState]=useState(null);

  const toast=(msg,type="success")=>setToastState({msg,type,id:Date.now()});

  const onLogin=u=>{
    setSession(u);
    if(!DEMO_ACCOUNTS.find(a=>a.email===u.email)) setUsers(p=>p.find(x=>x.email===u.email)?p:[...p,u]);
  };

  const go=p=>{
    const authRequired=["dashboard","admin","portal","passport"];
    if(authRequired.includes(p)&&!session){setAuthOpen(true);return;}
    if(p==="admin"&&!isAdmin(session)){toast("Admin access required","error");return;}
    if(p==="dashboard"&&!can(session,"create")){toast("Creator access required — visit the Volunteer Portal to apply","error");return;}
    setPage(p);window.scrollTo({top:0,behavior:"smooth"});
  };

  return(
    <div style={{minHeight:"100vh",background:C.bg}}>
      <Nav page={page} go={go} session={session} setSession={s=>{setSession(s);setPage("home");}} openAuth={()=>setAuthOpen(true)}/>

      <main>
        {page==="home"        &&<Home go={go} openAuth={()=>setAuthOpen(true)} session={session}/>}
        {page==="documentaries"&&<Documentaries videos={videos} setVideos={setVideos} session={session} toast={toast}/>}
        {page==="museum"      &&<Museum/>}
        {page==="map"         &&<HeritageMap/>}
        {page==="languages"   &&<Languages/>}
        {page==="stories"     &&<AIStories/>}
        {page==="clothing"    &&<FashionArchive/>}
        {page==="crafts"      &&<CraftsMarket toast={toast}/>}
        {page==="timeline"    &&<CulturalTimeline/>}
        {page==="ai"          &&<AIChat/>}
        {page==="dna"         &&<CulturalDNA go={go}/>}
        {page==="passport"    &&session&&<Passport session={session} toast={toast}/>}
        {page==="expeditions" &&<Expeditions session={session} toast={toast}/>}
        {page==="emergency"   &&<EmergencyDashboard session={session}/>}
        {page==="portal"      &&<VolunteerPortal session={session} openAuth={()=>setAuthOpen(true)} toast={toast}/>}
        {page==="news"        &&<HeritageNews/>}
        {page==="art"         &&<ArtForPreservation toast={toast}/>}
        {page==="dashboard"   &&session&&<CreatorDashboard videos={videos} setVideos={setVideos} session={session} toast={toast}/>}
        {page==="admin"       &&isAdmin(session)&&<AdminPanel videos={videos} setVideos={setVideos} toast={toast} session={session} users={users}/>}
      </main>

      {/* Footer */}
      <footer style={{background:C.navy,borderTop:"1px solid rgba(255,255,255,.08)",
        padding:"40px 24px 32px",marginTop:60}}>
        <div style={{maxWidth:1200,margin:"0 auto"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:28,marginBottom:36}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
                <div style={{width:32,height:32,background:`linear-gradient(135deg,${C.accent},${C.gold})`,
                  borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <I.Globe s={16} c={C.navy}/>
                </div>
                <span className="serif" style={{fontSize:18,fontWeight:600,color:"white"}}>
                  Heritage<span style={{color:C.gold}}>Verse</span>
                </span>
              </div>
              <p style={{fontSize:13,color:"rgba(255,255,255,.45)",lineHeight:1.7}}>
                Preserving indigenous cultures, endangered languages, and traditional craftsmanship with AI.
              </p>
            </div>
            {[["Platform",["Documentaries","Museum","Heritage Map","Languages","AI Chat"]],
              ["Marketplace",["Handmade Crafts","Fashion Archive","AI Stories","Cultural Timeline"]],
              ["Mission",["About HeritageArk","Our Methodology","Partner With Us","Donate"]]].map(([title,links])=>(
              <div key={title}>
                <h4 style={{fontSize:11,fontWeight:700,color:C.accent,textTransform:"uppercase",
                  letterSpacing:".08em",marginBottom:12}}>{title}</h4>
                {links.map(l=>(
                  <div key={l} style={{fontSize:13,color:"rgba(255,255,255,.5)",marginBottom:7,
                    cursor:"pointer",transition:"color .2s"}}
                    onMouseEnter={e=>e.currentTarget.style.color="rgba(255,255,255,.9)"}
                    onMouseLeave={e=>e.currentTarget.style.color="rgba(255,255,255,.5)"}>
                    {l}
                  </div>
                ))}
              </div>
            ))}
          </div>
          <div style={{borderTop:"1px solid rgba(255,255,255,.08)",paddingTop:20,
            display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
            <p style={{fontSize:12,color:"rgba(255,255,255,.3)"}}>
              © 2025 HeritageArk · Preserving culture through AI
            </p>
            <div style={{display:"flex",gap:12}}>
              {["Privacy","Terms","Contact"].map(l=>(
                <span key={l} style={{fontSize:12,color:"rgba(255,255,255,.35)",cursor:"pointer",
                  transition:"color .2s"}}
                  onMouseEnter={e=>e.currentTarget.style.color="rgba(255,255,255,.8)"}
                  onMouseLeave={e=>e.currentTarget.style.color="rgba(255,255,255,.35)"}>
                  {l}
                </span>
              ))}
            </div>
          </div>
        </div>
      </footer>

      {authOpen&&<AuthModal onClose={()=>setAuthOpen(false)} onLogin={onLogin}/>}
      {toastState&&<Toast key={toastState.id} msg={toastState.msg} type={toastState.type} onDone={()=>setToastState(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
