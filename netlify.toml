[build]
  command = "pnpm install --frozen-lockfile && cd apps/web && npx prisma generate && pnpm run build"
  publish = "apps/web/.next"
  base = "/"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
